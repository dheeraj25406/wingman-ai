name: Wingman AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install greenlet

      - name: Train and verify ML models
        run: |
          PYTHONPATH=. python -m ml.training.train_anomaly
          PYTHONPATH=. python -m ml.training.train_classifier
          PYTHONPATH=. python -m ml.evaluation.evaluate_models

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest backend/tests ml/tests agent/tests -v

      - name: Execute End-to-End Acceptance Scenario
        run: |
          PYTHONPATH=. python -m tests.test_end_to_end_scenario

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build
