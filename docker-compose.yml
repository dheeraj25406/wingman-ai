services:
  postgres:
    image: postgres:16-alpine
    container_name: wingman-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wingman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wingman_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wingman}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wingman} -d ${POSTGRES_DB:-wingman}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wingman-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+asyncpg://wingman:wingman_secure_pass@postgres:5432/wingman}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5180,http://localhost:80}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - PUBLIC_DEMO_MODE=true
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wingman-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional Observability Components via Profiles
  prometheus:
    image: prom/prometheus:latest
    container_name: wingman-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: wingman-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  postgres_data:
